name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: athana, POSTGRES_PASSWORD: athana, POSTGRES_DB: athana }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U athana" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://athana:athana@localhost:5432/athana
      TEST_DATABASE_URL: postgresql://athana:athana@localhost:5432/athana_test
      SEED_ADMIN_EMAIL: admin@athana.test
      SEED_ADMIN_PASSWORD: Admin-Local-2026!
      SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: PGPASSWORD=athana psql -h localhost -U athana -d athana -c 'CREATE DATABASE athana_test'
      - run: npm test
      - run: npx prisma migrate deploy && npm run db:seed
      - run: npm run build
      - run: node scripts/check-public-assets.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
