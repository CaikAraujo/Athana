# Production / staging stack: PostgreSQL + one-shot migration job + the application.
# Usage:  cp .env.example .env.production  →  fill it in  →  docker compose --env-file .env.production up -d --build
# TLS is terminated by your reverse proxy (see deploy/Caddyfile for a ready-made example).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: athana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: athana
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athana -d athana"]
      interval: 10s
      retries: 6

  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    env_file: ${ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql://athana:${POSTGRES_PASSWORD}@db:5432/athana
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build:
      context: .
      # NEXT_PUBLIC_* values are inlined at build time: they must be passed here, not only at runtime.
      args:
        NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_GOOGLE_ADS_ID: ${NEXT_PUBLIC_GOOGLE_ADS_ID:-}
        NEXT_PUBLIC_GOOGLE_ADS_PURCHASE_LABEL: ${NEXT_PUBLIC_GOOGLE_ADS_PURCHASE_LABEL:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql://athana:${POSTGRES_PASSWORD}@db:5432/athana
      STORAGE_DIR: /data/storage
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  uploads:
